ver:bg-brand-chrome"><h2 class="font-mono text-sm font-semibold text-white transition-colors group-hover:text-brand-orange">CPU Startup Boost with In-Place Pod Resize</h2><p class="mt-2 line-clamp-3 font-reading text-xs leading-relaxed text-brand-secondary">A local lab comparing four ways (sidecar, controller, operator, VPA) to give a Pod extra CPU at startup and shrink it in place once it is warm, with no restart.</p><p class="mt-3 font-mono text-xs text-brand-dim">graz-dev/k8s-cpu-burst-lab</p></button><button class="group block cursor-pointer border-l-4 border-brand-border bg-brand-elevated p-5 text-left transition-colors hover:border-brand-orange hover:bg-brand-chrome"><h2 class="font-mono text-sm font-semibold text-white transition-colors group-hover:text-brand-orange">K8s Resource Optimizer</h2><p class="mt-2 line-clamp-3 font-reading text-xs leading-relaxed text-brand-secondary">A closed-loop Kubernetes resource right-sizing system that observes workload metrics, evaluates them via OPA policies, and opens a GitOps PR with updated CPU/memory manifests — no direct cluster patching.</p><p class="mt-3 font-mono text-xs text-brand-dim">graz-dev/automatic-reosurce-optimization-loop</p></button><button class="group block cursor-pointer border-l-4 border-brand-border bg-brand-elevated p-5 text-left transition-colors hover:border-brand-orange hover:bg-brand-chrome"><h2 class="font-mono text-sm font-semibold text-white transition-colors group-hover:text-brand-orange">Observability on Edge</h2><p class="mt-2 line-clamp-3 font-reading text-xs leading-relaxed text-brand-secondary">A production-realistic observability pipeline for constrained edge environments, featuring tail-based sampling, file-backed persistent queues, unified signal correlation, and automatic gap-fill after link restoration.</p><p class="mt-3 font-mono text-xs text-brand-dim">graz-dev/observability-on-edge</p></button><button class="group block cursor-pointer border-l-4 border-brand-border bg-brand-elevated p-5 text-left transition-colors hover:border-brand-orange hover:bg-brand-chrome"><h2 class="font-mono text-sm font-semibold text-white transition-colors group-hover:text-brand-orange">Deploying GenAI Models on Kubernetes</h2><p class="mt-2 line-clamp-3 font-reading text-xs leading-relaxed text-brand-secondary">Tutorial for deploying LLMs on local Kubernetes (Minikube on Apple Silicon w/ GPU) following MLOps (GitOps) best practices with Helm, ArgoCD, and Istio.</p><p class="mt-3 font-mono text-xs text-brand-dim">graz-dev/llms-on-kubernetes</p></button><button class="group block cursor-pointer border-l-4 border-brand-border bg-brand-elevated p-5 text-left transition-colors hover:border-brand-orange hover:bg-brand-chrome"><h2 class="font-mono text-sm font-semibold text-white transition-colors group-hover:text-brand-orange">Ephemeral Environments with Crossplane and kube-green</h2><p class="mt-2 line-clamp-3 font-reading text-xs leading-relaxed text-brand-secondary">A collection of tutorials to create ephemeral environments with crossplane e kube-green.</p><p class="mt-3 font-mono text-xs text-brand-dim">graz-dev/crossplane-ephemeral-environments</p></button></div></div></div></div></div></div></main><footer class="mt-32 flex-none"><div class="sm:px-8"><div class="mx-auto w-full max-w-7xl lg:px-8"><div class="border-t border-zinc-100 pb-16 pt-10 dark:border-zinc-700/40"><div class="relative px-4 sm:px-8 lg:px-12"><div class="mx-auto max-w-2xl lg:max-w-5xl"><div class="flex flex-col items-center justify-between gap-6 sm:flex-row"><div class="flex flex-wrap justify-center gap-x-6 gap-y-1 text-sm font-medium text-zinc-800 dark:text-zinc-200"><a class="transition hover:text-brand-orange" href="/about-me/">About</a><a class="transition hover:text-brand-orange" href="/articles/">Articles</a><a class="transition hover:text-brand-orange" href="/speaking/">Speaking</a><a class="transition hover:text-brand-orange" href="/projects/">Code</a><a class="transition hover:text-brand-orange" href="/reports/">Reports</a><a class="transition hover:text-brand-orange" href="/pod-logs/">Newsletter</a></div><p class="text-sm text-zinc-500 dark:text-zinc-400">© <!-- -->2026<!-- --> Graziano Casto. All rights reserved.</p></div></div></div></div></div></div></footer></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"data":{"pageTitle":"Tutorials and Open Source - Graziano Casto","pageDescription":"Explore the tutorials and workshops Graziano Casto has created, and the open source projects he contributes to.","pageLink":"https://castograziano.com/projects","pageImage":"https://castograziano.com/graziano-casto.jpg","projects":[{"title":"GitOps Workshop with Kargo and Argo CD","type":"tutorial","description":"Hands-on GitOps workshop from KubeCon + CloudNativeCon North America 2026: promote releases through dev, staging and production with Kargo and Argo CD, on your laptop.","longDescription":"Hands-on labs built for KubeCon + CloudNativeCon North America 2026 in Salt Lake City. You build a promotion pipeline for a small web application: a new image version appears, and Kargo moves it through dev, staging and three production regions by committing to Git, while Argo CD syncs the cluster from Git. Along the way you see who does what, and how to add checks, rollbacks and approvals. A kind cluster with Gitea runs on your laptop, and a hosted Argo CD and Kargo are created for you on the Akuity Platform.","url":"https://github.com/graz-dev/kubecon-kargo-workshop"},{"title":"Falco Agentic Alert Triage","type":"tutorial","description":"An assistive, bounded agentic triage workflow for Falco alerts on Kubernetes: Google ADK and kagent correlate syscall and audit-log alerts into a report a human reviews.","longDescription":"A demo of an assistive, bounded agentic triage workflow on a local Kubernetes cluster. Falco detects runtime threats from syscalls and the Kubernetes audit log, and Falcosidekick forwards every alert to a lightweight receiver. A triage agent built with Google ADK and deployed via kagent accumulates alerts over a 30-second window, correlates them with Kubernetes context, and produces a structured report on a small web UI. The agent never takes remediation actions and never decides the verdict: a deterministic layer in the receiver enforces severity and escalation, the model writes the narrative, and a human reviews every report.","url":"https://github.com/graz-dev/falco-agentic-triage"},{"title":"CPU Startup Boost with In-Place Pod Resize","type":"tutorial","description":"A local lab comparing four ways (sidecar, controller, operator, VPA) to give a Pod extra CPU at startup and shrink it in place once it is warm, with no restart.","longDescription":"Many runtimes need much more CPU at startup (JIT compilation, class loading, cache warmup) than once they are warm. Sizing for the peak wastes idle CPU, sizing for the steady state throttles startup. With In-Place Pod Resize, stable since Kubernetes v1.35, a Pod can start with extra CPU and give it back without a restart. This lab runs on kind and compares four automation patterns (sidecar, controller, operator and VPA) with Prometheus and Grafana, so you can measure startup time, throttling and CPU held on your laptop.","url":"https://github.com/graz-dev/k8s-cpu-burst-lab"},{"title":"K8s Resource Optimizer","type":"tutorial","description":"A closed-loop Kubernetes resource right-sizing system that observes workload metrics, evaluates them via OPA policies, and opens a GitOps PR with updated CPU/memory manifests — no direct cluster patching.","longDescription":"A closed-loop Kubernetes resource right-sizing system built around a two-layer OPA policy architecture: a master engine managed by the platform team and per-workload Rego files owned by SREs. The orchestrator queries Prometheus for P95 CPU and peak memory data (with native JVM heap/non-heap metrics via OTel Java agent), sends only observational data to OPA, and — when a resize is recommended — creates a branch, patches the manifest using ruamel.yaml to preserve comments and formatting, and opens a GitHub PR with a full diagnostics table. Human-in-the-loop by design; full automation is possible via Renovate or Mergify.","url":"https://github.com/graz-dev/automatic-reosurce-optimization-loop"},{"title":"Observability on Edge","type":"tutorial","description":"A production-realistic observability pipeline for constrained edge environments, featuring tail-based sampling, file-backed persistent queues, unified signal correlation, and automatic gap-fill after link restoration.","longDescription":"A production-realistic observability pipeline designed for constrained edge environments with intermittent connectivity and limited resources. The edge node runs a demo Go app alongside a custom OTel Collector with tail-based sampling (buffers full traces before deciding keep/drop, retaining 100% of errors and high-latency traces while dropping ~80% of fast successful spans) and a file-backed bbolt queue providing ~47 hours of outage tolerance. Fluent Bit with Lua filtering applies identical sampling criteria to logs, achieving ~86% volume reduction while maintaining 1:1 alignment with kept traces. Every log carries a trace_id for cross-signal correlation in Grafana. On link restore, both Loki and Jaeger recover queued telemetry with original timestamps. Deployable locally via k3d or on Civo managed Kubernetes with no application changes.","url":"https://github.com/graz-dev/observability-on-edge"},{"title":"Deploying GenAI Models on Kubernetes","type":"tutorial","description":"Tutorial for deploying LLMs on local Kubernetes (Minikube on Apple Silicon w/ GPU) following MLOps (GitOps) best practices with Helm, ArgoCD, and Istio.","longDescription":"A comprehensive tutorial repository for deploying Large Language Models (LLMs) on local Kubernetes environments, specifically optimized for Minikube on Apple Silicon with GPU support. This project follows MLOps and GitOps best practices, demonstrating the integration of Helm for package management, ArgoCD for continuous deployment, and Istio for service mesh capabilities. Perfect for developers learning to productionize GenAI models.","url":"https://github.com/graz-dev/llms-on-kubernetes"},{"title":"Ephemeral Environments with Crossplane and kube-green","type":"tutorial","description":"A collection of tutorials to create ephemeral environments with crossplane e kube-green.","longDescription":"A collection of practical tutorials demonstrating how to create and manage ephemeral Kubernetes environments using Crossplane for Infrastructure as Code and kube-green for automatic resource scheduling. This project showcases efficient resource utilization patterns, demonstrating how to automatically spin up and tear down development environments based on schedules, reducing infrastructure costs while maintaining development productivity.","url":"https://github.com/graz-dev/crossplane-ephemeral-environments"}]},"schemas":[{"@context":"https://schema.org","@type":"ItemList","name":"Tutorials and workshops by Graziano Casto","itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"SoftwareSourceCode","name":"GitOps Workshop with Kargo and Argo CD","description":"Hands-on GitOps workshop from KubeCon + CloudNativeCon North America 2026: promote releases through dev, staging and production with Kargo and Argo CD, on your laptop.","url":"https://github.com/graz-dev/kubecon-kargo-workshop"}},{"@type":"ListItem","position":2,"item":{"@type":"SoftwareSourceCode","name":"Falco Agentic Alert Triage","description":"An assistive, bounded agentic triage workflow for Falco alerts on Kubernetes: Google ADK and kagent correlate syscall and audit-log alerts into a report a human reviews.","url":"https://github.com/graz-dev/falco-agentic-triage"}},{"@type":"ListItem","position":3,"item":{"@type":"SoftwareSourceCode","name":"CPU Startup Boost with In-Place Pod Resize","description":"A local lab comparing four ways (sidecar, controller, operator, VPA) to give a Pod extra CPU at startup and shrink it in place once it is warm, with no restart.","url":"https://github.com/graz-dev/k8s-cpu-burst-lab"}},{"@type":"ListItem","position":4,"item":{"@type":"SoftwareSourceCode","name":"K8s Resource Optimizer","description":"A closed-loop Kubernetes resource right-sizing system that observes workload metrics, evaluates them via OPA policies, and opens a GitOps PR with updated CPU/memory manifests — no direct cluster patching.","url":"https://github.com/graz-dev/automatic-reosurce-optimization-loop"}},{"@type":"ListItem","position":5,"item":{"@type":"SoftwareSourceCode","name":"Observability on Edge","description":"A production-realistic observability pipeline for constrained edge environments, featuring tail-based sampling, file-backed persistent queues, unified signal correlation, and automatic gap-fill after link restoration.","url":"https://github.com/graz-dev/observability-on-edge"}},{"@type":"ListItem","position":6,"item":{"@type":"SoftwareSourceCode","name":"Deploying GenAI Models on Kubernetes","description":"Tutorial for deploying LLMs on local Kubernetes (Minikube on Apple Silicon w/ GPU) following MLOps (GitOps) best practices with Helm, ArgoCD, and Istio.","url":"https://github.com/graz-dev/llms-on-kubernetes"}},{"@type":"ListItem","position":7,"item":{"@type":"SoftwareSourceCode","name":"Ephemeral Environments with Crossplane and kube-green","description":"A collection of tutorials to create ephemeral environments with crossplane e kube-green.","url":"https://github.com/graz-dev/crossplane-ephemeral-environments"}}]}],"oss":{"generatedAt":"2026-11-13","totals":{"mergedPRs":32,"repositories":5,"organizations":1,"reviewedPRs":73},"contributions":[{"org":"kubernetes","mergedPRs":32,"repos":[{"name":"website","mergedPRs":24},{"name":"contributor-site","mergedPRs":2},{"name":"org","mergedPRs":2},{"name":"k8s.io","mergedPRs":2},{"name":"sig-
